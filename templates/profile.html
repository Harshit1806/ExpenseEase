
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile · ExpenseEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="mx-auto max-w-2xl px-4 py-10">
    <a href="{{ url_for('home') }}" class="text-sm font-semibold text-blue-600">← Dashboard</a>
    <h1 class="mt-4 text-3xl font-bold">My Profile</h1>
    <p class="mt-2 text-sm text-slate-500">Update the profile details shown in ExpenseEase.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mt-5 space-y-2">
          {% for category, message in messages %}
            <p class="rounded-xl border p-3 text-sm">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <form method="POST" class="mt-6 space-y-5 rounded-2xl border border-slate-200 bg-white p-6">
      <label class="block text-sm font-medium">
        Display name
        <input name="display_name" maxlength="80" required value="{{ profile.display_name }}"
               class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3">
      </label>

      <label class="block text-sm font-medium">
        Email address
        <input name="email" type="email" maxlength="120" value="{{ profile.email }}"
               class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3">
      </label>

      <button type="submit" class="rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-700">
        Save profile
      </button>
      <a href="{{ url_for('settings') }}" class="ml-3 text-sm font-semibold text-blue-600">Settings</a>
    </form>
  </main>
</body>
</html>
