
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Edit Expense · ExpenseEase</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-50 text-slate-800">
  <main class="mx-auto max-w-2xl px-4 py-10">
    <a href="{{ url_for('transactions') }}"
       class="text-sm font-semibold text-blue-600 hover:text-blue-800">
      ← Back to Transactions
    </a>

    <section class="mt-5 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
      <h1 class="text-2xl font-bold text-slate-900">Edit expense</h1>
      <p class="mt-2 text-sm text-slate-500">
        Update the details of your transaction.
      </p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="mt-4 space-y-2">
            {% for category, message in messages %}
              <div class="rounded-xl border px-4 py-3 text-sm
                {% if category == 'success' %}
                  border-emerald-200 bg-emerald-50 text-emerald-800
                {% else %}
                  border-rose-200 bg-rose-50 text-rose-800
                {% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}

      <form method="POST"
            action="{{ url_for('edit', expense_id=expense.id) }}"
            class="mt-6 space-y-5">

        <label class="block text-sm font-medium text-slate-700">
          Description
          <input
            type="text"
            name="description"
            maxlength="120"
            required
            value="{{ expense.description }}"
            class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50">
        </label>

        <label class="block text-sm font-medium text-slate-700">
          Amount (₹)
          <input
            type="number"
            name="amount"
            min="0.01"
            step="0.01"
            required
            value="{{ '%.2f'|format(expense.amount) }}"
            class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50">
        </label>

        <label class="block text-sm font-medium text-slate-700">
          Category
          <select
            name="category"
            required
            class="mt-2 w-full rounded-xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50">
            {% for cat in categories %}
              <option value="{{ cat }}"
                {% if expense.category == cat %}selected{% endif %}>
                {{ cat }}
              </option>
            {% endfor %}
          </select>
        </label>

        <label class="block text-sm font-medium text-slate-700">
          Date
          <input
            type="date"
            name="date"
            required
            value="{{ expense.date.strftime('%Y-%m-%d') }}"
            class="mt-2 w-full rounded-xl border border-slate-200 px-4 py-3 outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-50">
        </label>

        <div class="flex flex-wrap gap-3 pt-2">
          <button
            type="submit"
            class="rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-700">
            Save changes
          </button>

          <a
            href="{{ url_for('transactions') }}"
            class="rounded-xl border border-slate-200 px-5 py-3 text-sm font-semibold text-slate-600 hover:bg-slate-50">
            Cancel
          </a>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
